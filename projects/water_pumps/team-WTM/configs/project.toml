# Paths are relative to project_root. Raw filenames are relative to raw_dir.
[paths]
project_root = ".."  # relative to this configuration file
raw_dir = "data/raw"
training_values = "Training_set_values.csv"
training_labels = "Training_set_labels.csv"
test_records = ["test_features.csv.csv", "Test_set_values.csv", "test_features.csv"]
submission_format = "Submission_format.csv"
split_plan = "data/processed/sprint2_splits.csv"
report_dir = "reports/sprint2"
model_file = "models/final_pipeline.joblib"
predictions_file = "data/processed/test_predictions.csv"

[evaluation]
random_seed = 42
folds = 5

[comparison]
candidates = ["logistic_regression", "logistic_regression_balanced", "random_forest", "random_forest_balanced"]
logistic_max_iter = 2000
forest_trees = 300
forest_jobs = -1
